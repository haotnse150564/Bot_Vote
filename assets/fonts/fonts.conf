<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig riêng cho bot — KHÔNG phụ thuộc font đã cài sẵn trên máy chủ
  (không cần cài font hệ thống bằng apt/sudo trên môi trường deploy).

  Bot render bảng Scrim/Bang Chiến thành ảnh PNG (googleSheets/screenshotSheet.js)
  bằng sharp -> librsvg -> fontconfig để tìm font. Nếu máy chủ không có sẵn
  font hỗ trợ chữ Hán (CJK), chữ sẽ hiện thành ô vuông "tofu" kèm mã hex thay
  vì chữ thật (VD: tên ingame tiếng Trung của người chơi).

  File này khai báo thêm 1 thư mục font riêng (chính thư mục chứa file này)
  để fontconfig biết và dùng font Noto Sans CJK bundle sẵn trong repo, thay
  vì trông chờ máy chủ đã cài sẵn.

  Được nạp qua biến môi trường FONTCONFIG_PATH set ở đầu index.js (xem
  index.js) — KHÔNG thay thế fontconfig hệ thống, chỉ bổ sung thêm 1 nguồn
  font (<dir> không có prefix="xml" tức là gộp thêm, không ghi đè config gốc
  của hệ thống nếu máy chủ đã có sẵn).
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
